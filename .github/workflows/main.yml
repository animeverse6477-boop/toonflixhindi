name: ToonflixHindi Stream Server

on:
  workflow_dispatch:          # Actions tab se manually start karne ke liye
  schedule:
    - cron: "0 */6 * * *"     # backup: agar auto-restart chain toot jaye to har 6 ghante me dobara start

# Ek hi time par ek hi server chalna chahiye (2 bot polling karenge to Telegram "Conflict" dega)
concurrency:
  group: toonflix-server
  cancel-in-progress: false

permissions:
  contents: read
  actions: write              # run khatam hone par khud ko dobara start karne ke liye

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 355      # GitHub ki limit 360 min hai

    env:
      PORT: "8000"

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dependencies install
        run: pip install -r requirements.txt

      - name: cloudflared install
        run: |
          curl -fsSL -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Tunnel start (trycloudflare URL nikalna)
        run: |
          nohup cloudflared tunnel --no-autoupdate --url "http://localhost:${PORT}" > tunnel.log 2>&1 &

          URL=""
          for i in $(seq 1 45); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | grep -v '^https://api\.' | head -n1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "Tunnel URL nahi mila. Log:"
            cat tunnel.log
            exit 1
          fi

          echo "Tunnel URL: $URL"
          # main.py is ORIGIN_URL ko Firebase me likhta hai, Worker wahin se padhta hai
          echo "ORIGIN_URL=$URL" >> "$GITHUB_ENV"
          echo "START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Bot + Stream server chalao
        timeout-minutes: 345  # ~5h45m chalega, phir neeche wala step naya run shuru karega
        env:
          # ---- Secrets (zaroori) ----
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          STORAGE_CHANNEL: ${{ secrets.STORAGE_CHANNEL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}          # Cloudflare Worker ka fixed URL
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          # ---- Variables (optional) ----
          ALLOWED_USERS: ${{ vars.ALLOWED_USERS }}
          PLAYER_ORIGINS: ${{ vars.PLAYER_ORIGINS }}
          OLD_ROUTE_PREFIXES: ${{ vars.OLD_ROUTE_PREFIXES }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          ROUTE_PREFIX: ${{ vars.ROUTE_PREFIX }}
          # ORIGIN_URL upar wale step se GITHUB_ENV ke through aa jata hai
        run: python main.py

      - name: Naya run shuru karo (auto-restart)
        if: ${{ !cancelled() }}   # manually cancel karoge to restart nahi hoga
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ELAPSED=$(( $(date +%s) - START_TS ))
          # Agar server 20 min se pehle hi band ho gaya (config error/crash) to restart loop se bacho
          if [ "$ELAPSED" -lt 1200 ]; then
            echo "Server sirf ${ELAPSED}s chala - restart nahi kar raha. Upar ke logs me error dekho."
            exit 0
          fi
          gh workflow run "${{ github.workflow }}" \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}"
